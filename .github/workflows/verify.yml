name: Verify Martlet npm
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: core-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: martlet-npm
          path: dist/
