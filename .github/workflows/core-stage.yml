name: Stage core publication
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full accepted main commit SHA
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the accepted publishable-form tarball
        required: true
        type: string
      distribution_tag:
        description: npm distribution tag
        required: true
        type: choice
        options: [next, latest]
permissions:
  contents: read
concurrency:
  group: core-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  stage:
    # Restricted environment and npm owner approval remain publication boundaries.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: core-stage-review
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify accepted source identity, ancestry and unused registry version
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs preflight
      - run: npm ci --ignore-scripts && npm run build && npm test && git diff --exit-code
      - name: Reproduce and compare accepted archive twice
        id: archive
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs prepare "$RUNNER_TEMP"
      - name: Recheck live main and registry immediately before staging
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs preflight
      - name: Stage accepted archive for separate npm 2FA approval
        env:
          NPM_TAG: ${{ inputs.distribution_tag }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          [[ "$NPM_TAG" = next || "$NPM_TAG" = latest ]]
          npm stage publish "$ARCHIVE" --access public --tag "$NPM_TAG" --provenance
