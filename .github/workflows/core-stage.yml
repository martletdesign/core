name: Stage core publication
on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Stage for separate approval, or publish directly through the trusted publisher
        required: true
        default: stage
        type: choice
        options: [stage, publish]
      source_commit:
        description: Full accepted main commit SHA
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the accepted publishable-form tarball
        required: true
        type: string
      distribution_tag:
        description: npm distribution tag
        required: true
        type: choice
        options: [next, latest]
permissions:
  contents: read
concurrency:
  group: core-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  stage:
    # Preserve the registered trusted-publisher workflow and environment identity.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: core-stage-review
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.archive.outputs.name }}
      version: ${{ steps.archive.outputs.version }}
      published: ${{ steps.publication.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify accepted source identity, ancestry and unused registry version
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs preflight
      - run: npm ci --ignore-scripts && npm run build && npm test && git diff --exit-code
      - name: Reproduce and compare accepted archive twice
        id: archive
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs prepare "$RUNNER_TEMP"
      - name: Recheck live main and registry immediately before staging
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/stage-core.mjs preflight
      - name: Reject a conflicting release tag before direct publication
        if: inputs.publish_mode == 'publish'
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
        run: node scripts/auto-publish-core.mjs guard-tag
      - name: Publish or stage the exact accepted archive
        id: publication
        env:
          NPM_TAG: ${{ inputs.distribution_tag }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          PUBLISH_MODE: ${{ inputs.publish_mode || 'stage' }}
        run: |
          set -euo pipefail
          [[ "$NPM_TAG" = next || "$NPM_TAG" = latest ]]
          case "$PUBLISH_MODE" in
            stage) npm stage publish "$ARCHIVE" --access public --tag "$NPM_TAG" --provenance ;;
            publish)
              npm publish "$ARCHIVE" --access public --tag "$NPM_TAG" --provenance
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown publication mode" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: inputs.publish_mode == 'publish'
        with:
          name: core-published-${{ github.run_id }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 3
  complete:
    needs: stage
    if: inputs.publish_mode == 'publish' && needs.stage.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      APPROVED_SHA: ${{ inputs.source_commit }}
      EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
      RELEASE_TAG: v${{ needs.stage.outputs.version }}
      PACKAGE_NAME: ${{ needs.stage.outputs.name }}
      PACKAGE_VERSION: ${{ needs.stage.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: core-published-${{ github.run_id }}
          path: ${{ runner.temp }}/core-publication
      - name: Verify actual registry bytes, signatures and exact trusted-publisher provenance
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/core-publication/martlet-core-$PACKAGE_VERSION.tgz"
          node scripts/tag-release-cli.mjs verify-registry "$ARCHIVE"
          mkdir "$RUNNER_TEMP/core-publication-consumer"
          printf '{"name":"publication-verification","version":"0.0.0","private":true}\n' > "$RUNNER_TEMP/core-publication-consumer/package.json"
          (
            cd "$RUNNER_TEMP/core-publication-consumer"
            installed=0
            for attempt in {1..24}; do
              if npm install --prefer-online --ignore-scripts --no-audit --no-fund --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION" > "$RUNNER_TEMP/core-publication-install.log" 2>&1; then
                cat "$RUNNER_TEMP/core-publication-install.log"
                installed=1
                break
              fi
              cat "$RUNNER_TEMP/core-publication-install.log"
              # Version metadata and the install packument can propagate separately.
              # Retry only a missing version; other install failures remain fatal.
              grep -q 'ETARGET' "$RUNNER_TEMP/core-publication-install.log" || exit 1
              sleep 5
            done
            test "$installed" = 1
            npm audit signatures --json --include-attestations > "$RUNNER_TEMP/core-publication-audit.json"
          )
          node scripts/tag-release-cli.mjs verify-stage-provenance "$RUNNER_TEMP/core-publication-audit.json" "$ARCHIVE"
      - name: Create the exact immutable tag and dispatch existing source-release completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/auto-publish-core.mjs complete "$RUNNER_TEMP/core-publication/martlet-core-$PACKAGE_VERSION.tgz"
