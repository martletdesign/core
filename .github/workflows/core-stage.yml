name: Stage core publication (disabled draft)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed commit SHA already integrated on main
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the reviewed publishable-form tarball
        required: true
        type: string
      distribution_tag:
        description: Reviewed npm distribution tag
        required: true
        type: choice
        options: [next, latest]
permissions:
  contents: read
jobs:
  stage:
    # Inert in this draft; activation, environment setup and npm trust require
    # separate authorization. npm 2FA approval is a second, independent gate.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: core-stage-review
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify reviewed source identity and ancestry
        env:
          APPROVED_SHA: ${{ inputs.source_commit }}
          EXPECTED_REPOSITORY: martletdesign/core
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p=require("./package.json"),s=require("./source.json");if(p.name!=="@martlet/core"||p.version!=="2.2.3"||p.private!==true||s.version!==p.version)process.exit(1)'
      - run: npm ci --ignore-scripts && npm run build && npm test && git diff --exit-code
      - name: Build and compare reviewed archive
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_SHA256" = "1395eb206514b54500e4a098b1aafe59492c516c301a7e8c81a18672f6f4ce42"
          umask 077
          mkdir "$RUNNER_TEMP/core-src" "$RUNNER_TEMP/core-out"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/core-src"
          node -e 'const fs=require("fs"),p=process.argv[1],v=JSON.parse(fs.readFileSync(p));if(v.name!=="@martlet/core"||v.version!=="2.2.3"||v.private!==true)process.exit(1);v.private=false;fs.writeFileSync(p,JSON.stringify(v,null,2)+"\n")' "$RUNNER_TEMP/core-src/package.json"
          (cd "$RUNNER_TEMP/core-src" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/core-out")
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/core-out/martlet-core-2.2.3.tgz" | sha256sum --check
      - name: Stage reviewed archive for separate npm 2FA approval
        env:
          NPM_TAG: ${{ inputs.distribution_tag }}
        run: |
          [[ "$NPM_TAG" = next || "$NPM_TAG" = latest ]]
          npm stage publish "$RUNNER_TEMP/core-out/martlet-core-2.2.3.tgz" --access public --tag "$NPM_TAG" --provenance
