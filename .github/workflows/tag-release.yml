name: Tag-driven core release (disabled proposal)
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: core-tag-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ false }}
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    # Separate authorization and review of controls are required to enable.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: core-production-release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REF_PROTECTED: ${{ github.ref_protected }}
      RELEASE_ENVIRONMENT_READY: ${{ vars.CORE_RELEASE_ENVIRONMENT_READY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify protected tag, production history, source identity and registry
        id: identity
        run: node scripts/tag-release-cli.mjs preflight
      - run: npm ci --ignore-scripts && npm run build && npm test && git diff --exit-code
      - name: Export and inspect an isolated publishable archive
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/core-src" "$RUNNER_TEMP/core-out"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/core-src"
          node -e 'const fs=require("fs"),p=process.argv[1],v=JSON.parse(fs.readFileSync(p));if(v.private!==true)process.exit(1);v.private=false;fs.writeFileSync(p,JSON.stringify(v,null,2)+"\n")' "$RUNNER_TEMP/core-src/package.json"
          (cd "$RUNNER_TEMP/core-src" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/core-out")
          node scripts/tag-release-cli.mjs inspect "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz"
      - name: Recheck tag and version immediately before publication
        run: node scripts/tag-release-cli.mjs preflight
      - name: Refuse an existing or unverifiable GitHub Release before npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release-absent.mjs
      - name: Publish the inspected archive with npm provenance
        run: npm publish "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz" --access public --tag "${{ steps.identity.outputs.channel }}" --provenance
      - name: Independently verify registry identity, integrity and bytes
        run: node scripts/tag-release-cli.mjs verify-registry "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz"
      - name: Verify npm signatures and exact release provenance
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/provenance-consumer"
          printf '{"name":"release-verification","version":"0.0.0","private":true}\n' > "$RUNNER_TEMP/provenance-consumer/package.json"
          (cd "$RUNNER_TEMP/provenance-consumer" && npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION" && npm audit signatures --json --include-attestations > "$RUNNER_TEMP/provenance-audit.json")
          node scripts/tag-release-cli.mjs verify-provenance "$RUNNER_TEMP/provenance-audit.json" "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz"
      - name: Recheck tag before release creation
        run: node scripts/tag-release-cli.mjs verify-tag
      - name: Recheck release absence immediately before creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release-absent.mjs
      - name: Create GitHub Release after registry verification
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = next ]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
