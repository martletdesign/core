name: Complete published Core source release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: core-tag-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify protected tag, accepted main identity and existing publication
        id: identity
        run: node scripts/tag-release-cli.mjs completion-preflight
      - run: npm ci --ignore-scripts && npm run build && npm test && git diff --exit-code
      - name: Reproduce and inspect the published archive
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/core-src" "$RUNNER_TEMP/core-out"
          git archive HEAD | tar --same-permissions -x -C "$RUNNER_TEMP/core-src"
          node -e 'const fs=require("fs"),p=process.argv[1],v=JSON.parse(fs.readFileSync(p));if(v.private!==true)process.exit(1);v.private=false;fs.writeFileSync(p,JSON.stringify(v,null,2)+"\n")' "$RUNNER_TEMP/core-src/package.json"
          (cd "$RUNNER_TEMP/core-src" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/core-out")
          node scripts/tag-release-cli.mjs inspect "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz"
          node scripts/tag-release-cli.mjs verify-registry "$RUNNER_TEMP/core-out/martlet-core-${{ steps.identity.outputs.version }}.tgz"
      - name: Verify npm signatures and exact staged publication provenance
        env:
          PACKAGE_NAME: ${{ steps.identity.outputs.name }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/provenance-consumer"
          printf '{"name":"release-verification","version":"0.0.0","private":true}\n' > "$RUNNER_TEMP/provenance-consumer/package.json"
          (cd "$RUNNER_TEMP/provenance-consumer" && npm install --ignore-scripts --no-audit --no-fund --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION" && npm audit signatures --json --include-attestations > "$RUNNER_TEMP/provenance-audit.json")
          node scripts/tag-release-cli.mjs verify-stage-provenance "$RUNNER_TEMP/provenance-audit.json" "$RUNNER_TEMP/core-out/martlet-core-$PACKAGE_VERSION.tgz"
      - name: Recheck remote tag and release absence before completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/tag-release-cli.mjs verify-tag
          node scripts/github-release-absent.mjs
      - name: Create GitHub Release with verified source package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/core-out"
          sha256sum "martlet-core-$PACKAGE_VERSION.tgz" > SHA256SUMS
          if [ "$CHANNEL" = next ]; then
            gh release create "$RELEASE_TAG" "martlet-core-$PACKAGE_VERSION.tgz" SHA256SUMS --verify-tag --generate-notes --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "martlet-core-$PACKAGE_VERSION.tgz" SHA256SUMS --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
