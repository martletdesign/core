name: Published provenance rehearsal (read only)
on:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify existing registry signatures and provenance
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/consumer" "$RUNNER_TEMP/archive"
          printf '{"name":"nightjar-audit","version":"0.0.0","private":true}\n' > "$RUNNER_TEMP/consumer/package.json"
          (cd "$RUNNER_TEMP/consumer" && npm install --ignore-scripts --legacy-peer-deps --save-exact --no-audit --no-fund @martlet/core@2.2.3 && npm audit signatures --json --include-attestations > "$RUNNER_TEMP/audit.json")
          npm pack @martlet/core@2.2.3 --ignore-scripts --pack-destination "$RUNNER_TEMP/archive"
          node scripts/published-provenance-rehearsal.mjs "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/archive/martlet-core-2.2.3.tgz"
